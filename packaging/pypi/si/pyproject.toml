[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "sigit-si-cli"
description = "si, the sigit.si command line interface."
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["version"]
license = { text = "Apache-2.0" }
authors = [{ name = "Seto Elkahfi", email = "seto@sigit.si" }]
keywords = ["cli", "git", "sigit", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sigit.si"
Repository = "https://github.com/getsigit/si"
Issues = "https://github.com/getsigit/si/issues"

[tool.maturin]
manifest-path = "../../../crates/cli/Cargo.toml"
bindings = "bin"
strip = true
