[workspace]
resolver = "2"
members = ["crates/cli", "crates/sigit-si-api"]

# The workspace exists for one reason: `sigit-si-api` is a standalone, typed
# client for the sigit.si JSON API that the desktop app (sigit-app) can depend
# on without pulling in clap, dialoguer, and the rest of the terminal surface.
# `cli` is the thin `si` binary on top of it.
[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["Seto Elkahfi <seto@sigit.si>"]
license = "Apache-2.0"
repository = "https://github.com/getsigit/si"
homepage = "https://sigit.si"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.15"
dialoguer = "0.11"
dirs = "6.0"
git2 = { version = "0.20", default-features = false }
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
] }
rmcp = { version = "3.2", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sigit-si-api = { version = "1.1.0", path = "crates/sigit-si-api" }
tabled = { version = "0.20", default-features = false, features = ["std"] }
thiserror = "2.0"
# `io-std` is what the MCP stdio transport binds to.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
